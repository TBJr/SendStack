services:
  sendstack:
    build: .
    ports:
      - "8080:8080"
    environment:
      SENDSTACK_HOST: 0.0.0.0
      SENDSTACK_PORT: 8080
      SENDSTACK_PUBLIC_URL: http://localhost:8080
      SENDSTACK_DB_PATH: /app/data/sendstack.db
      SENDSTACK_DELIVERY_MODE: sandbox
      SENDSTACK_ADMIN_EMAIL: admin@sendstack.local
      SENDSTACK_ADMIN_PASSWORD: ChangeMe123!
      SENDSTACK_RATE_PER_SECOND: 1
      SENDSTACK_DAILY_LIMIT: 50
    volumes:
      - ./data:/app/data
    restart: unless-stopped
